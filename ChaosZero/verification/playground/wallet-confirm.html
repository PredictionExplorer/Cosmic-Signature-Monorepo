<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review transaction · V4 playground</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #131724;
        color: #f4f5fa;
      }
      main {
        max-width: 44rem;
        margin: 9vh auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.6rem);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 55vh;
        overflow: auto;
        line-height: 1.7;
        background: #202536;
        padding: 1.25rem;
        border-radius: 0.5rem;
      }
      form {
        margin-top: 1.25rem;
        display: flex;
        gap: 0.75rem;
      }
      button {
        padding: 0.75rem 1.2rem;
        font: inherit;
        border-radius: 0.4rem;
        background: #202536;
        border: 1px solid #85899b;
        color: inherit;
        cursor: pointer;
      }
      button[value="confirm"] {
        background: #f9c866;
        color: #191b23;
        border-color: #f9c866;
      }
      button:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Review local transaction</h1>
      <pre id="summary" aria-label="Transaction details"></pre>
      <details>
        <summary>Raw call data</summary>
        <pre id="data"></pre>
      </details>
      <form>
        <button value="cancel" autofocus>Cancel</button
        ><button value="confirm">Confirm transaction</button>
      </form>
    </main>
  </body>
</html>

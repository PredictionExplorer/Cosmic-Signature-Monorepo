name: Game — V4 art auction verification
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"
on:
  pull_request:
    paths:
      - Cosmic-Signature/**
      - ChaosZero/**
      - .github/workflows/game-v4-art-auction.yml
      - scripts/ci/install-game-solc.sh
      - .node-version
      - .gitmodules
    branches:
      - main
      - V4
  push:
    branches:
      - main
      - V4
    paths:
      - Cosmic-Signature/**
      - ChaosZero/**
      - .github/workflows/game-v4-art-auction.yml
      - scripts/ci/install-game-solc.sh
      - .node-version
      - .gitmodules
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      soak:
        description: Run the longer four-version campaign
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: Cosmic-Signature
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V4_SOAK: ${{ github.event_name == 'schedule' || inputs.soak || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Cosmic-Signature/package-lock.json
      - run: npm ci
      - name: Install the native game compiler
        working-directory: .
        run: ./scripts/ci/install-game-solc.sh
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - name: Build the game-funded market from this checkout
        run: |
          chaos_root=$(node test/runners/prepare-chaos-zero.js)
          echo "CHAOS_ZERO_ROOT=$chaos_root" >> "$GITHUB_ENV"
      - run: npm run test:credentials
      - name: Test the quick suite across all compiler profiles
        if: env.V4_SOAK != 'true'
        run: npm run hardhat-test-quick
        env:
          TERM: xterm
          FUZZ_SEED: '0x4101'
      - name: Replay the second four-version seed and the immediate V2 upgrade case
        if: env.V4_SOAK != 'true'
        run: |
          FUZZ_SEED=0x71aa npx --no-install hardhat test --no-compile test/tests-src/FuzzTest.js
          FUZZ_SEED=0xceda43 FUZZ_V2_ROUNDS=0 npx --no-install hardhat test --no-compile test/tests-src/FuzzTest.js
        env:
          HARDHAT_MODE_CODE: '1'
          LONG_TEST_MODE_CODE: '1'
          ENABLE_HARDHAT_PREPROCESSOR: 'false'
      - name: Fuzz V1 through V4 with fresh replayable seeds
        if: env.V4_SOAK == 'true'
        run: |
          npx --no-install hardhat test test/tests-src/FuzzTest.js
        env:
          HARDHAT_MODE_CODE: '1'
          LONG_TEST_MODE_CODE: '3'
          ENABLE_HARDHAT_PREPROCESSOR: 'false'
          FUZZ_MAX_SECONDS: '1200'
      - name: Fuzz the auction with the verified game compiler
        id: auction_fuzz
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$V4_SOAK" == "true" ]]; then
            FOUNDRY_FUZZ_SEED=$(node -p "'0x' + require('node:crypto').randomBytes(32).toString('hex')")
            export FOUNDRY_FUZZ_SEED FOUNDRY_FUZZ_RUNS=4096 FOUNDRY_INVARIANT_RUNS=256 FOUNDRY_INVARIANT_DEPTH=128
          fi
          {
            forge config --json | jq '{seed:.fuzz.seed,fuzzRuns:.fuzz.runs,invariantRuns:.invariant.runs,depth:.invariant.depth}'
            npm run test:auction:fuzz -- --use "$HOME/.solc-select/artifacts/solc-0.8.38/solc-0.8.38" --offline
          } 2>&1 | tee "$RUNNER_TEMP/auction-fuzz.log"
      - name: Preserve the auction failure and minimized sequence
        if: failure() && steps.auction_fuzz.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-auction-fuzz-failure
          path: |
            ${{ runner.temp }}/auction-fuzz.log
            Cosmic-Signature/cache/fuzz/
            Cosmic-Signature/cache/invariant/
          retention-days: 30

name: Chaos Zero verification
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"

permissions: {}

on:
  push:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos.yml
      - .gitmodules
  pull_request:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos.yml
      - .gitmodules
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    working-directory: ChaosZero
jobs:
  contracts:
    name: Contract and differential checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ChaosZero/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ChaosZero/.node-version
          cache: pnpm
          cache-dependency-path: ChaosZero/pnpm-lock.yaml
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - name: Install locked developer tools
        run: pnpm install --frozen-lockfile
      - name: Contract formatting, build, unit, fuzz, invariants and differential fixtures
        run: pnpm check:contracts

  frontend:
    name: Frontend and developer tooling
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ChaosZero/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ChaosZero/.node-version
          cache: pnpm
          cache-dependency-path: |
            ChaosZero/pnpm-lock.yaml
            ChaosZero/frontend/pnpm-lock.yaml
      - name: Install locked developer tools
        run: pnpm install --frozen-lockfile
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Formatting, lint, types, coverage, production build and dependency audit
        env:
          FUZZ_SEED: '17019'
        run: pnpm check:frontend
      - name: Save frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: ChaosZero/frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Local prototype browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ChaosZero/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ChaosZero/.node-version
          cache: pnpm
          cache-dependency-path: |
            ChaosZero/pnpm-lock.yaml
            ChaosZero/frontend/pnpm-lock.yaml
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - name: Install locked developer tools
        run: pnpm install --frozen-lockfile
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the local mock-token prototype
        run: pnpm test:e2e
      - name: Preserve browser report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-results
          path: |
            ChaosZero/playwright-report/
            ChaosZero/test-results/
          if-no-files-found: ignore
          retention-days: 14

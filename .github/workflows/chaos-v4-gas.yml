name: Chaos Zero — V4 market gas snapshots
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"

on:
  pull_request:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos-v4-gas.yml
      - .gitmodules
  push:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos-v4-gas.yml
      - .gitmodules
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ChaosZero
jobs:
  gas:
    name: Check isolated V4 market calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ChaosZero/.node-version
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: forge fmt --check benchmarks
      - run: node scripts/check-v4-gas.mjs

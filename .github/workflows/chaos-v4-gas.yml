name: Chaos Zero — V4 market gas snapshots
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"

on:
  pull_request:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos-v4-gas.yml
      - .gitmodules
  push:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos-v4-gas.yml
      - .gitmodules
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ChaosZero
jobs:
  gas:
    name: Check isolated V4 market calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ChaosZero/.node-version
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: forge fmt --check benchmarks
      - run: node scripts/check-v4-gas.mjs

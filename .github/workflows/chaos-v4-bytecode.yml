name: Chaos Zero — V4 bytecode identity
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"
on:
  pull_request:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos-v4-bytecode.yml
      - .gitmodules
  push:
    branches:
      - main
      - V4
    paths:
      - ChaosZero/**
      - .github/workflows/chaos-v4-bytecode.yml
      - .gitmodules
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: ChaosZero
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ChaosZero/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ChaosZero/.node-version
          cache: pnpm
          cache-dependency-path: ChaosZero/pnpm-lock.yaml
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/bytecode-identity.test.mjs
      - run: pnpm verify:bytecode

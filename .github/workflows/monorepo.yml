name: Monorepo integration
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"

on:
  push:
    branches: [main, V4]
  pull_request:
    branches: [main, V4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository tooling and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Verify repository tooling, documentation and migration history
        run: make test-repo

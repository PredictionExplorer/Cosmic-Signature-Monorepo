name: Monorepo integration
run-name: "${{ github.workflow }} (${{ github.event_name }} on ${{ github.ref_name }})"

on:
  push:
    branches: [main, V4]
  pull_request:
    branches: [main, V4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository tooling and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify repository tooling, documentation and migration history
        run: make test-repo

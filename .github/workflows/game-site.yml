name: Game site verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - V4
    paths:
      - cosmicgame-frontend/**
      - Cosmic-Signature/**
      - .github/workflows/game-site.yml
  pull_request:
    branches:
      - main
      - V4
    paths:
      - cosmicgame-frontend/**
      - Cosmic-Signature/**
      - .github/workflows/game-site.yml
permissions:
  contents: read
defaults:
  run:
    working-directory: cosmicgame-frontend

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cosmicgame-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci

      # Blocking, like the pre-push hook: advisories, lockfile integrity, and
      # time-boxed exceptions (audit-exceptions.json) — see README → Dependencies.
      - name: Audit dependencies
        run: npm run deps:audit

      - name: Run lint
        run: npm run lint

      - name: Enforce i18n catalog integrity (parity, ICU, plurals) for every locale
        run: npm run i18n:strict

      - name: Enforce copy conventions (script, punctuation, disallowed patterns) in every translated locale
        run: npm run i18n:conventions

      - name: Enforce canonical terminology in every translated locale
        run: npm run terminology:check

      - name: Enforce the lexicon in every locale
        run: npm run lexicon:scan

      - name: Type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Preserve coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: game-site-coverage
          path: cosmicgame-frontend/coverage/
          retention-days: 14
      - name: Build
        run: npm run build

      # The resolved <head> of every prerendered page: og:image, og:url,
      # twitter:site and the other fields a shallow metadata merge can drop.
      # The pre-push hook runs it too, but a push with --no-verify or a PR
      # from a machine without husky reaches only this job.
      - name: Enforce share metadata
        run: npm run seo:share-check

      - name: Enforce app-home bundle budget
        run: npm run bundle:budget

  e2e:
    name: Browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    needs: lint-test-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: ${{ strategy.job-total }}
      # The harness tier has its own job below (it needs Docker, Go, and the
      # sibling repos); this job runs the mocked-API projects only.
      HARNESS_E2E: '0'
      NEXT_PUBLIC_PLAYWRIGHT_UX_SCENARIOS: '1'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cosmicgame-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('cosmicgame-frontend/package-lock.json') }}

      # WebKit backs the Mobile Safari project, which runs the mobile layout
      # audits. iOS Safari is where most mobile-only layout bugs actually
      # appear, and Chromium does not reproduce them.
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e -- --shard="$SHARD/$SHARD_COUNT"

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: |
            cosmicgame-frontend/playwright-report
            cosmicgame-frontend/test-results
          retention-days: 7

  # The game and site share a revision. The external indexer uses the harness lock.
  harness-e2e:
    runs-on: ubuntu-24.04
    needs: lint-test-build
    env:
      COSMIC_CONTRACTS_DIR: ${{ github.workspace }}/Cosmic-Signature
      RWCG_BACKEND_DIR: ${{ github.workspace }}/.external/augur-explorer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check out the external indexer and API
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: PredictionExplorer/augur-explorer
          ref: 28a470988c23ed7024317af87226f67a1b5d191d
          path: .external/augur-explorer
          persist-credentials: false
      - name: Verify the indexer checkout matches the harness lock
        working-directory: .
        run: |
          revision=$(git -C .external/augur-explorer rev-parse HEAD)
          jq -e --arg revision "$revision" '
            .backend.repository == "PredictionExplorer/augur-explorer" and .backend.ref == $revision
          ' cosmicgame-frontend/harness.lock.json > /dev/null
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cosmicgame-frontend/package-lock.json
      - name: Setup Go (backend toolchain)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: .external/augur-explorer/go.mod
          cache-dependency-path: .external/augur-explorer/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Install contracts repo dependencies
        run: npm ci
        working-directory: Cosmic-Signature

      - name: Install the native game compiler and the backend migration CLI
        run: |
          compiler="$HOME/.solc-select/artifacts/solc-0.8.38/solc-0.8.38"
          mkdir -p "$(dirname "$compiler")"
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/argotorg/solc-bin/68447de66b15599f2e23af0051ab2080053746e4/linux-amd64/solc-linux-amd64-v0.8.38+commit.1835d247' -o "$compiler"
          echo "65c3180a336eabb6bdc4bbd49cc405aeb233976964ae6c11fba2a6c8be8f3243  $compiler" | sha256sum --check --strict
          chmod +x "$compiler"

          mkdir -p "$RUNNER_TEMP/goose-bin"
          curl -fsSL --retry 3 'https://github.com/pressly/goose/releases/download/v3.27.2/goose_linux_x86_64' -o "$RUNNER_TEMP/goose-bin/goose"
          echo "29abceca027ee0da2cf28ca6c64c76d08e52a28acd4cf1919b832c77dd4bec4b  $RUNNER_TEMP/goose-bin/goose" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/goose-bin/goose"
          echo "$RUNNER_TEMP/goose-bin" >> "$GITHUB_PATH"

      - name: Build backend binaries
        run: make build
        working-directory: .external/augur-explorer

        env:
          CGO_ENABLED: '0'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: harness-playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('cosmicgame-frontend/package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.harness-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps only
        if: steps.harness-playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run harness e2e tests
        run: npm run test:e2e:harness

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs
          path: |
            cosmicgame-frontend/.harness/logs
            cosmicgame-frontend/playwright-report
          retention-days: 7

name: Nightly V4 fuzz campaign
run-name: V4 fuzz · ${{ github.event_name }} · ${{ github.event_name == 'pull_request' && 'smoke' || inputs.mode || 'full' }}

on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Full three-hour campaign or one-pass smoke
        required: true
        default: full
        type: choice
        options: [full, smoke]
  pull_request:
    branches: [V4]
    paths:
      - '.github/workflows/nightly-fuzz.yml'
      - 'scripts/ci/nightly-fuzz.py'
      - 'scripts/tests/test_nightly_fuzz.py'
      - 'scripts/run-fuzz.mjs'

permissions:
  contents: read

concurrency:
  # GitHub can replace a pending run in a concurrency group. Give cron its own queue.
  group: v4-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'pull_request' || inputs.mode == 'smoke') && 45 || 270 }}
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ChaosZero/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            ChaosZero/pnpm-lock.yaml
            ChaosZero/frontend/pnpm-lock.yaml
            axiomzero/pnpm-lock.yaml
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - name: Install locked dependencies
        run: make setup
      - name: Prepare compilers and production artifacts before starting the clock
        env:
          HARDHAT_MODE_CODE: '1'
          LONG_TEST_MODE_CODE: '1'
          ENABLE_HARDHAT_PREPROCESSOR: 'false'
        run: |
          ./scripts/ci/install-game-solc.sh
          (cd Cosmic-Signature && npx --no-install hardhat compile)
          (cd Cosmic-Signature && forge build --use "$HOME/.solc-select/artifacts/solc-0.8.38/solc-0.8.38" --offline)
          (cd ChaosZero && forge build)
      - name: Run serial replayable fuzz passes
        id: fuzz
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.mode || 'full' }}
        run: exec python3 scripts/ci/nightly-fuzz.py --mode "$MODE" --output "$RUNNER_TEMP/nightly-fuzz"
      - name: Preserve time, seeds, final pass and minimized failures
        if: always() && steps.fuzz.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-fuzz-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nightly-fuzz/
            Cosmic-Signature/cache/fuzz/
            Cosmic-Signature/cache/invariant/
            ChaosZero/cache/fuzz/
            ChaosZero/cache/invariant/
          retention-days: ${{ steps.fuzz.outcome == 'failure' && 30 || 14 }}
          if-no-files-found: error

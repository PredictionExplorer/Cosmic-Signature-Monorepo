name: CI

on:
  push:
    branches: [main, V4]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack downloads the pnpm version pinned in package.json; never prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test:unit

      - name: Build
        run: corepack pnpm build

      - name: Install Playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium webkit

      # Playwright starts its own production server (see playwright.config.ts)
      # and covers the public flows plus the axe accessibility audit. Pages
      # read the live collection backends and the public Arbitrum RPC, so the
      # config's CI retries absorb transient rate limiting.
      - name: End-to-end and accessibility tests
        run: corepack pnpm test:e2e

      - name: Audit production dependencies
        run: corepack pnpm audit --prod

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
